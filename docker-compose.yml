services:
  db:
    image: postgres:16-alpine
    container_name: book_agg_db
    environment:
      POSTGRES_DB: book_aggregator
      POSTGRES_USER: book
      POSTGRES_PASSWORD: book_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book -d book_aggregator"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
